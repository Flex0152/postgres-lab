services:
  db:
    image: docker.io/library/postgres:18.7
    container_name: postgres_sql_srv
    restart: unless-stopped
    shm_size: 256mb
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - /srv/data/databases/postgres/data:/var/lib/postgresql
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  pgadmin:
    image: docker.io/dpage/pgadmin4:9.18
    container_name: pgadmin
    restart: unless-stopped
    secrets:
      - pgadmin_password
    ports:
      - "127.0.0.1:5050:8080"
    volumes:
      - /srv/data/applications/pgadmin/pgadmindata:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@home.arpa
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['arpa']"
    networks:
      - postgres-network
    depends_on:
      db:
        condition: service_healthy
networks:
  postgres-network:
    driver: bridge
secrets:
  postgres_password:
    file: ./secrets/postgres_password

  pgadmin_password:
    file: ./secrets/pgadmin_password

